plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.dateparser'
    buildFeatures { compose true }
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.dateparser'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation project(':dateparser')
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
}

// Reuse exactly the shared commonMain sample compiled by the independent KMP consumer.
// This does not add Compose or Android dependencies to the published parser.
kotlin {
    sourceSets {
        main {
            kotlin.srcDir("../integration/consumer/src/commonMain/kotlin")
        }
    }
}
