name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable Maven Central version
        required: true
        default: '0.1.0'
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: maven-central
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate release inputs without exposing credentials
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
      - run: python3 scripts/generate_rules.py --check
      - name: Verify exact release sources
        run: ./gradlew :dateparser:jvmTest :dateparser:testAndroidHostTest :dateparser:iosSimulatorArm64Test :dateparser:compileKotlinIosArm64 :app:assembleDebug -PreleaseVersion="$RELEASE_VERSION" --stacktrace
      - name: Validate complete publication bundle and native consumer
        run: |
          ./gradlew :dateparser:publishAllPublicationsToTestRepository -PlocalPublication=true -PreleaseVersion="$RELEASE_VERSION"
          python3 scripts/check_publication.py build/test-repository --native --version "$RELEASE_VERSION"
          ./gradlew -p integration/consumer iosSimulatorArm64Test -PparserVersion="$RELEASE_VERSION"
      - name: Sign, upload and release all KMP variants
        run: ./gradlew :dateparser:publishAndReleaseToMavenCentral -PreleaseVersion="$RELEASE_VERSION" --stacktrace
